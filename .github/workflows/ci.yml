name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler }}-${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [debug, asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang lld zlib1g-dev
      - name: Configure
        run: |
          preset=${{ matrix.config }}
          if [ "${{ matrix.compiler }}" = "clang" ]; then preset="clang-${{ matrix.config }}"; fi
          echo "PRESET=$preset" >> "$GITHUB_ENV"
          cmake --preset "$preset" -DLLE_WERROR=ON
      - name: Build
        run: cmake --build --preset "$PRESET"
      - name: Test
        run: ctest --preset "$PRESET" --timeout 600
